name: Release Please

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Without this the action fails with "Input required and not supplied:
      # token", which says nothing about which token or why one is needed.
      # It cannot fall back to GITHUB_TOKEN: a release created with that token
      # does not trigger other workflows, and release-build.yml runs on
      # `release: created`. Falling back would publish no image and report
      # success, which is worse than stopping here.
      - name: Require the release token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_PLEASE_TOKEN}" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is not set for this repository." \
                 "release-please needs a token that is not GITHUB_TOKEN, because a" \
                 "release created with GITHUB_TOKEN does not trigger release-build.yml" \
                 "and no image would be published."
            exit 1
          fi
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: rust
